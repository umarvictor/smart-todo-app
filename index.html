<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login — FocusFlow</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<div class="container">

    <h2>Welcome Back</h2>

    <p class="subtitle">
        Sign in to continue your streak.
    </p>

    <!-- ========================= -->
    <!-- EMAIL                     -->
    <!-- ========================= -->

    <div class="form-group">

        <label for="loginEmail">
            Email Address
        </label>

        <input
            id="loginEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email">

    </div>


    <!-- ========================= -->
    <!-- PASSWORD                  -->
    <!-- ========================= -->

    <div class="form-group">

        <label for="loginPassword">
            Password
        </label>

        <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password">

    </div>


    <!-- ========================= -->
    <!-- REMEMBER ME               -->
    <!-- ========================= -->

    <div class="checkbox-group">

        <input
            type="checkbox"
            id="rememberMe">

        <label for="rememberMe">
            Keep me signed in
        </label>

    </div>


    <!-- ========================= -->
    <!-- ERROR MESSAGE             -->
    <!-- ========================= -->

    <small
        id="loginError"
        class="error">
    </small>


    <!-- ========================= -->
    <!-- LOGIN BUTTON              -->
    <!-- ========================= -->

    <button
        type="button"
        id="loginBtn"
        onclick="login()">

        Sign In

    </button>


    <!-- ========================= -->
    <!-- FORGOT PASSWORD           -->
    <!-- ========================= -->

    <p>
        <a href="forgot.html">
            Forgot your password?
        </a>
    </p>


    <!-- ========================= -->
    <!-- SIGN UP LINK              -->
    <!-- ========================= -->

    <p>
        No account?
        <a href="signup.html">
            Create one free →
        </a>
    </p>
    <!-- ========================= -->
<!-- SUCCESS TOAST             -->
<!-- ========================= -->

<div
    id="loginToast"
    class="success-msg"
    style="display:none;text-align:center;margin-top:12px;">
</div>

</div>

<script src="js/auth.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<div class="container">

    <h2>Welcome Back</h2>

    <p class="subtitle">
        Sign in to continue.
    </p>

    <div class="form-group">

        <label for="loginEmail">
            Email Address
        </label>

        <input
            id="loginEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required>

    </div>

    <div class="form-group">

        <label for="loginPassword">
            Password
        </label>

        <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>

    </div>

    <button
        id="loginBtn"
        onclick="login()">

        Login

    </button>

    <p>

        No account?

        <a href="signup.html">

            Sign Up

        </a>

    </p>

</div>

<script src="js/auth.js"></script>
<script src="js/main.js"></script>

</body>

</html>

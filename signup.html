<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sign Up — FocusFlow</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<div class="container">

    <h2>Create Account</h2>

    <p class="subtitle">
        Start building your focus habit today.
    </p>


    <!-- ========================= -->
    <!-- FULL NAME                 -->
    <!-- ========================= -->

    <div class="form-group">

        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Ada Lovelace"
            autocomplete="name">

        <small
            id="nameError"
            class="error">
        </small>

    </div>


    <!-- ========================= -->
    <!-- EMAIL                     -->
    <!-- ========================= -->

    <div class="form-group">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email">

        <small
            id="emailError"
            class="error">
        </small>

    </div>


    <!-- ========================= -->
    <!-- PASSWORD                  -->
    <!-- ========================= -->

    <div class="form-group">

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Min 8 chars, 1 uppercase, 1 number, 1 special"
            autocomplete="new-password">

        <small
            id="passwordError"
            class="error">
        </small>

    </div>


    <!-- ========================= -->
    <!-- CONFIRM PASSWORD          -->
    <!-- ========================= -->

    <div class="form-group">

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Repeat your password"
            autocomplete="new-password">

        <small
            id="confirmPasswordError"
            class="error">
        </small>

    </div>


    <!-- ========================= -->
    <!-- TERMS CHECKBOX            -->
    <!-- ========================= -->

    <div class="checkbox-group">

    <input
        type="checkbox"
        id="terms"
        required>

    <label for="terms">
        I agree to the Terms and Conditions
    </label>

</div>

    <small
        id="termsError"
        class="error">
    </small>


    <!-- ========================= -->
    <!-- SIGNUP BUTTON             -->
    <!-- ========================= -->

    <button
        type="button"
        id="signupBtn"
        onclick="signup()"
        disabled>

        Create Account

    </button>


    <!-- ========================= -->
    <!-- LOGIN LINK                -->
    <!-- ========================= -->

    <p>
        Already have an account?
        <a href="index.html">
            Sign in →
        </a>
    </p>

</div>

<script src="js/validation.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
